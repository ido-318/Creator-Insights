[server]
address = "127.0.0.1"
headless = true
enableCORS = true
enableXsrfProtection = true
enableStaticServing = false
allowedHosts = ["localhost", "127.0.0.1", "::1", "*.streamlit.app"]

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = "none"

[theme]
base = "dark"
primaryColor = "#19C3B3"
backgroundColor = "#080C12"
secondaryBackgroundColor = "#101821"
textColor = "#E8F3F3"
borderColor = "#1F2D3A"
linkColor = "#5EEAD4"
font = "sans-serif"
baseFontSize = 15
baseRadius = "14px"
buttonRadius = "12px"
headingFontSizes = [
    "40px",
    "28px",
    "21px",
    "18px",
    "16px",
    "14px",
]
headingFontWeights = [
    700,
    600,
    600,
    600,
    500,
    500,
]
metricValueFontSize = "2.5rem"
metricValueFontWeight = 600
showWidgetBorder = true
showSidebarBorder = true
chartCategoricalColors = [
    "#19C3B3",
    "#4F8CFF",
    "#F2B84B",
    "#B78CF0",
]

[theme.sidebar]
backgroundColor = "#05080D"
secondaryBackgroundColor = "#101821"
